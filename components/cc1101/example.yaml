esphome:
  # ...
  libraries:
    - SPI
    - "SmartRC-CC1101-Driver-Lib"
  # For debugging, store generated code in an accessible location:
  # build_path: "../config/esphome/component_build"

# ...

external_components:
  - source: 
      type: local
      path: components

cc1101:
  id: transceiver
  bandwidth: 200
  frequency: 868.65
  sck_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23
  csn_pin: GPIO5
  gdo0_pin:
    number: 32
    allow_other_uses: true

remote_receiver:
  - id: receiver
    pin:
      number: 32
      allow_other_uses: true
    dump: all
