number:
  - platform: template
    name: "SPA ELECTRIC ID0 Input (249-0xF9)(J246-0xF6)"
    optimistic: true
    min_value: 0
    max_value: 255
    initial_value: 249
    step: 1
    mode: box
    id: SPA_ELECTRIC_ID0_Input
    on_value:
      then:
        - lambda: |-
            id(int_id0) = id(SPA_ELECTRIC_ID0_Input).state;
            ESP_LOGD("custom", "SPA ELECTRIC ID0 Input state updated to: %d", id(int_id0));

  - platform: template
    name: "SPA ELECTRIC ID1 Input (203-0xCB)(J166-0xA6)"
    optimistic: true
    min_value: 0
    max_value: 255
    initial_value: 203
    step: 1
    mode: box
    id: SPA_ELECTRIC_ID1_Input
    on_value:
      then:
        - lambda: |-
            id(int_id1) = id(SPA_ELECTRIC_ID1_Input).state;
            ESP_LOGD("custom", "SPA ELECTRIC ID1 Input state updated to: %d", id(int_id1));

button:
  - platform: template
    name: "${device_name} TX Selection"
    on_press:
      - logger.log: "The getcode Button Was Pressed"
      - cc1101.begin_tx: transceiver
      - remote_transmitter.transmit_raw:
          code: !lambda |-
            return id(transceiver).get_data(
              id(int_id0),
              id(int_id1),
              id(int_instruction),
              id(int_mode)
            );
          repeat:
            times: 5
      - cc1101.end_tx: transceiver
      - logger.log: "The getcode Tx has happened"
  
  - platform: template
    name: "${device_name} Show Details"
    on_press:
      - lambda: |-
          ESP_LOGD("custombutton", "int_id0 is now: %d", id(int_id0));
          ESP_LOGD("custombutton", "int_id1 is now: %d", id(int_id1));
          ESP_LOGD("custombutton", "int_instruction is now: %d", id(int_instruction));
          ESP_LOGD("custombutton", "int_mode is now: %d", id(int_mode));
