# CC1101    WIRE        ESP Lolin32       ESP32-30PIN
#   VCC     RED         3V3               3V3
#   GND     BLACK       GND               GND
#   MOSI    BLUE        GPIO23            GPIO23
#   SCLK    GREEN       GPIO18            GPIO18
#   MISO    YELLOW      GPIO19            GPIO19
#   GDO02   WHITE       GPIO4             GPIO4
#   GDO0    PURPLE      GPIO16            GPIO2
#   CSN     ORANGE      GPIO5             GPIO5

substitutions:
  device_name: cc1101

external_components:
  - source: github://gregb79/esphome-cc1101@passinfoworking
#external_components:
#  - source: github://gregb79/components-esphome@modulation
#    components: [ cc1101 ]


esphome:
  name: ${device_name}

esp32:
  board: nodemcu-32s
  variant: esp32
  framework:
    type: arduino

wifi:
  ssid: "Project"
  password: "project1"

 # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "OffAirIris"
    password: "12345678"

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: "4ccbb1e816a3f995343d9e144adb88f2"

web_server:
  port: 80
  version: 3

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

cc1101:
  - platform: cc1101
    id: transceiver
    cs_pin: GPIO5
    gdo0: GPIO32
    gdo2: GPIO33
    bandwidth: 200
    frequency: 915985
    modulation: 0
    deviation: 160
    #rssi:
    #  name: "${device_name} rssi"
    #lqi:
    #  name: "${device_name} lqi"
  
remote_transmitter:
  - pin: GPIO16 # GDO0
    carrier_duty_percent: 100%

#remote_receiver:
#  pin: GPIO4 # GDO2
#  dump:
#    # - raw

# Example configuration entry
globals:
  - id: int_id0
    type: int
    restore_value: no
    initial_value: '249'
  - id: int_id1
    type: int
    restore_value: no
    initial_value: '203'
  - id: int_instruction
    type: int
    restore_value: no
    initial_value: '17'
  - id: int_mode
    type: int
    restore_value: no
    initial_value: '1'

select:
  - platform: template
    name: "SPA ELECTRIC MODE SELECT"
    id: SPA_ELECTRIC_MODE_Select
    optimistic: true
    restore_value: true
    options:
      - "Pool and Spa 3"
      - "Pool Only 1"
      - "Spa Only 2"
    initial_option: "Pool Only 1"
    on_value:
      then:
        - logger.log:
            format: "Chosen option: %s "
            args: ["x.c_str()"]
        - lambda: |-
           ESP_LOGD("custom", "Current selected option: %s", id(SPA_ELECTRIC_MODE_Select).state.c_str());
            if (id(SPA_ELECTRIC_MODE_Select).state == "Pool and Spa 3") {
              ESP_LOGD("custom", "Selected Pool and Spa: 3");
              id(int_mode) = 3;
              ESP_LOGD("custom", "%d", id(int_mode));
            } else if (id(SPA_ELECTRIC_MODE_Select).state == "Pool Only 1") {
              ESP_LOGD("custom", "Selected Pool Only: 1");
              id(int_mode) =1;
              ESP_LOGD("custom", "%d", id(int_mode)); 
            } else if (id(SPA_ELECTRIC_MODE_Select).state == "Spa Only 2") {
              ESP_LOGD("custom", "Selected Spa Only: 2");
              id(int_mode) =2;
              ESP_LOGD("custom", "%d", id(int_mode)); 
            }


