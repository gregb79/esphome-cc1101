# CC1101    WIRE        ESP Lolin32       ESP32-30PIN
#   VCC     RED         3V3               3V3
#   GND     BLACK       GND               GND
#   MOSI    BLUE        GPIO23            GPIO23
#   SCLK    GREEN       GPIO18            GPIO18
#   MISO    YELLOW      GPIO19            GPIO19
#   GDO02   WHITE       GPIO4             GPIO4
#   GDO0    PURPLE      GPIO16            GPIO2
#   CSN     ORANGE      GPIO5             GPIO5

substitutions:
  device_name: cc1101

external_components:
  - source: github://gregb79/esphome-cc1101@moddevworking
#external_components:
#  - source: github://gregb79/components-esphome@modulation
#    components: [ cc1101 ]


esphome:
  name: ${device_name}

esp32:
  board: nodemcu-32s
  variant: esp32
  framework:
    type: arduino

wifi:
  ssid: "Project"
  password: "project1"

 # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "OffAirIris"
    password: "12345678"

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: "4ccbb1e816a3f995343d9e144adb88f2"

web_server:
  port: 80
  version: 3

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

sensor:
  - platform: cc1101
    id: transceiver
    cs_pin: GPIO5
    gdo0: GPIO32
    gdo2: GPIO33
    bandwidth: 200
    frequency: 915985
    modulation: 0
    deviation: 160
    #rssi:
    #  name: "${device_name} rssi"
    #lqi:
    #  name: "${device_name} lqi"
  
remote_transmitter:
  - pin: GPIO16 # GDO0
    carrier_duty_percent: 100%

#remote_receiver:
#  pin: GPIO4 # GDO2
#  dump:
#    # - raw

button:
  - platform: template
    name: "${device_name} Raw"
    on_press:
      - logger.log: "The Raw Button Was Pressed"
      - cc1101.begin_tx: transceiver
      - remote_transmitter.transmit_raw:
            code: [105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-312,105,-104,210,-104,315,-104,105,-104,105,-208,525,-208,315,-208,105,-104,210,-1144,105,-312,105,-728,105,-208,105,-104,105,-208,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-312,105,-104,210,-104,315,-104,105,-104,105,-208,525,-208,315,-208,105,-104,210,-1144,105,-312,105,-728,105,-208,105,-104,105,-208,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-312,105,-104,210,-104,315,-104,105,-104,105,-208,525,-208,315,-208,105,-104,210,-1144,105,-312,105,-728,105,-208,105,-104,105,-208,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-104,105,-312,105,-104,210,-104,315,-104,105,-104,105,-208,525,-208,315,-208,105,-104,210,-1144,105,-312,105,-728,105,-208,105,-104,105,-208]
      - cc1101.end_tx: transceiver
